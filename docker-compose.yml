services:
  postgres:
    image: postgres:16-alpine
    container_name: autoops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoops}
      POSTGRES_DB: ${POSTGRES_DB:-autoops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: ./simulator
    container_name: autoops-simulator
    restart: unless-stopped
    environment:
      SIMULATOR_PORT: ${SIMULATOR_PORT:-9000}
    ports:
      - "9000:9000"

  backend:
    build:
      context: ./backend
    container_name: autoops-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://autoops:autoops@postgres:5432/autoops}
      SIMULATOR_URL: ${SIMULATOR_URL:-http://simulator:9000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: autoops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    build:
      context: ./monitoring/prometheus
    container_name: autoops-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - simulator

  grafana:
    build:
      context: ./monitoring/grafana
    container_name: autoops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
